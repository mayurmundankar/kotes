# Lints and builds every push and pull request. Pushes to master then build for
# production and deploy to the server, using the settings in the kotes-env
# environment (setup: README → Automatic deploys).
name: Check and deploy

on:
  push:
    branches: [master]
    paths-ignore: ["mobile/**", "**.md"]
  pull_request:
    paths-ignore: ["mobile/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: check
    if: github.repository == 'mayurmundankar/kotes' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: kotes-env
    # One at a time: a newer push waits for the running deploy.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # Prerendered pages bake this in, so this build is the one that ships.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Package the release
        run: bash scripts/package-release.sh kotes-release.tgz
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          options="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          release="/tmp/kotes-release-$GITHUB_SHA.tgz"
          scp $options kotes-release.tgz "$TARGET:$release"
          ssh $options "$TARGET" "git -C '$DEPLOY_PATH' fetch --quiet origin master && git -C '$DEPLOY_PATH' reset --hard --quiet '$GITHUB_SHA' && bash '$DEPLOY_PATH/scripts/deploy.sh' '$release'"
      # Straight to the server: Cloudflare can refuse requests from GitHub's runners.
      - name: Check the live site
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --resolve "${SITE_URL#https://}:443:$DEPLOY_HOST" "$SITE_URL/api/health"
